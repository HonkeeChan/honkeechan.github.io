# 陈洪健的博客
title: 陈洪健的博客
email: honkeechan@gmail.com
description: >-
  学习笔记 · 旅游规划 · 技术随笔
baseurl: ""
url: "https://honkeechan.github.io"
theme: minima

# 导航
header_pages:
  - travel/index.md
  - about.md

# 时区
timezone: Asia/Shanghai

# Markdown 引擎
# ⚠️ 必须显式开启 GFM：kramdown 默认 input 是 kramdown，不会自动把裸 URL 转成可点链接
# （2026-09-14 修复：日报的原文链接在页面上是死文本，无法跳转）
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# 默认布局
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      author: 陈洪健
