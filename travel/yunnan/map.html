let rulerMode = false, rulerPoints = [], rulerLine = null, rulerMarkers = [];
function toggleRuler() {
    rulerMode = !rulerMode;
    document.getElementById('ruler-btn').style.background = rulerMode ? '#ff7a1a' : '#f0f0f0';
    document.getElementById('ruler-hint').textContent = rulerMode ? '🟢 测距中：点击地图加点，双击结束' : '';
    if (!rulerMode) clearRuler();
}
function clearRuler() {
    rulerPoints = [];
    if (rulerLine) { map.removeLayer(rulerLine); rulerLine = null; }
    rulerMarkers.forEach(m => map.removeLayer(m)); rulerMarkers = [];
    document.getElementById('ruler-dist').textContent = '';
}
function haversine(a, b) {
    const R = 6371, dLat = (b[0]-a[0])*Math.PI/180, dLon = (b[1]-a[1])*Math.PI/180;
    const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
}
map.on('click', e => {
    if (!rulerMode) return;
    rulerPoints.push([e.latlng.lat, e.latlng.lng]);
    const m = L.circleMarker(e.latlng, {radius:4, color:'#ff0000'}).addTo(map);
    rulerMarkers.push(m);
    if (rulerPoints.length >= 2) {
        if (rulerLine) map.removeLayer(rulerLine);
        rulerLine = L.polyline(rulerPoints, {color:'#ff0000', dashArray:'6 4'}).addTo(map);
        let total = 0;
        for (let i=1; i<rulerPoints.length; i++) total += haversine(rulerPoints[i-1], rulerPoints[i]);
        document.getElementById('ruler-dist').textContent = `总距离: ${total.toFixed(1)} 公里`;
    }
});
